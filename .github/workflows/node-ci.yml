# Reusable: pnpm/npm Node CI.
#
# Check name: "<caller job id> / node-ci".

name: Node CI (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: >-
          Node version used only when the working directory has no .nvmrc.
          A committed .nvmrc always wins, so the CI runtime and the local
          runtime cannot drift apart.
        required: false
        type: string
        default: "22"
      command:
        description: The command that constitutes the gate.
        required: false
        type: string
        default: pnpm run check
      working-directory:
        description: Directory the install and the command run in.
        required: false
        type: string
        default: "."
      runs-on:
        description: >-
          JSON array of runner labels, consumed with fromJSON. A reusable
          workflow cannot take a list input, hence the JSON string.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      enable-node-cache:
        description: >-
          Let actions/setup-node save and restore the package-manager store.
          Callers running on a self-hosted runner MUST pass false: that machine
          already keeps a warm pnpm/npm store between jobs, so the cache action
          only adds a multi-gigabyte upload on every run, which burns the 10 GB
          per-repository Actions cache quota and evicts everything else in it.
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-ci:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect the package manager and the Node version source
        id: detect
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pm=pnpm
            lockfile=pnpm-lock.yaml
          elif [ -f package-lock.json ]; then
            pm=npm
            lockfile=package-lock.json
          else
            echo "::error title=No lockfile::neither pnpm-lock.yaml nor package-lock.json found in ${{ inputs.working-directory }}"
            exit 1
          fi
          echo "pm=${pm}" >> "$GITHUB_OUTPUT"
          echo "lockfile=${{ inputs.working-directory }}/${lockfile}" >> "$GITHUB_OUTPUT"
          # setup-node warns when node-version and node-version-file are both
          # set, so only ever populate one of them.
          if [ -f .nvmrc ]; then
            echo "node-version-file=${{ inputs.working-directory }}/.nvmrc" >> "$GITHUB_OUTPUT"
            echo "node-version=" >> "$GITHUB_OUTPUT"
          else
            echo "node-version-file=" >> "$GITHUB_OUTPUT"
            echo "node-version=${{ inputs.node-version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "using ${pm}"

      - name: Set up pnpm
        if: steps.detect.outputs.pm == 'pnpm'
        # No `version`: action-setup reads the `packageManager` field of
        # package.json, so the pinned pnpm version lives in the repository that
        # uses it and never here. Must run before setup-node, which needs pnpm
        # on PATH to locate the store for `cache: pnpm`.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.detect.outputs.node-version }}
          node-version-file: ${{ steps.detect.outputs.node-version-file }}
          cache: ${{ inputs.enable-node-cache && steps.detect.outputs.pm || '' }}
          cache-dependency-path: ${{ steps.detect.outputs.lockfile }}

      - name: Install dependencies
        run: |
          if [ "${{ steps.detect.outputs.pm }}" = pnpm ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run the gate
        run: ${{ inputs.command }}
