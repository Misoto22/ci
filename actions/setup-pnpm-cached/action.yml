# Composite: install pnpm, install Node, restore the store, install the project.
#
# For repositories that keep a bespoke workflow (kioku, misoto22-site) and only
# want the repeated setup steps, not a whole job shape.
#
#   - uses: Misoto22/ci/actions/setup-pnpm-cached@<sha> # v0.1.0
#     with:
#       enable-cache: "false"   # on a self-hosted runner

name: Set up pnpm with caching
description: Install pnpm and Node, optionally cache the store, and install.

inputs:
  node-version:
    description: >-
      Node version used only when the working directory has no .nvmrc.
      A committed .nvmrc always wins.
    required: false
    default: "22"
  enable-cache:
    description: >-
      "true" or "false". A self-hosted runner MUST pass "false": that machine
      already keeps a warm pnpm store between jobs, so actions/cache only adds a
      multi-gigabyte upload per run against the 10 GB per-repository quota.
    required: false
    default: "true"
  working-directory:
    description: Directory holding package.json and pnpm-lock.yaml.
    required: false
    default: "."
  install:
    description: '"true" runs pnpm install --frozen-lockfile after the setup steps.'
    required: false
    default: "true"

outputs:
  cache-hit:
    description: Whether the pnpm store was restored.
    value: ${{ steps.node.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve the Node version source
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # setup-node warns when node-version and node-version-file are both
        # set, so only ever populate one of them.
        if [ -f .nvmrc ]; then
          echo "node-version-file=${{ inputs.working-directory }}/.nvmrc" >> "$GITHUB_OUTPUT"
          echo "node-version=" >> "$GITHUB_OUTPUT"
        else
          echo "node-version-file=" >> "$GITHUB_OUTPUT"
          echo "node-version=${{ inputs.node-version }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up pnpm
      # No `version`: action-setup reads the `packageManager` field of
      # package.json. Must run before setup-node, which needs pnpm on PATH to
      # locate the store for `cache: pnpm`.
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - name: Set up Node
      id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.detect.outputs.node-version }}
        node-version-file: ${{ steps.detect.outputs.node-version-file }}
        cache: ${{ inputs.enable-cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
