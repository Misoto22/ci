[project]
name = "misoto-ios-checks"
version = "0.13.0" # x-release-please-version
description = "Swift source checks shared by the Misoto iOS apps"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
misoto-ios-checks = "misoto_ios_checks.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misoto_ios_checks"]
