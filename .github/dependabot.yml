# Keep the pinned action SHAs fresh.
#
# Dependabot rewrites both the SHA and the `# vX.Y.Z` comment when the comment
# sits on the same line as the `uses:` reference, which is the whole reason this
# repository writes them that way.
#
# It does not follow `docker://` references, so the actionlint image tag in
# .github/workflows/ci.yml is bumped by hand.

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/actions/setup-uv-cached"
      - "/actions/setup-pnpm-cached"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
