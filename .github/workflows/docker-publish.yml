# Reusable: build a container image and push it to GHCR.
#
# Deliberately minimal. The services that already have a bespoke build workflow
# (kioku, misoto22-site, zhaojian) keep theirs; this exists so a repository that
# wants a container without inventing one again can call four lines.
#
# Check name: "<caller job id> / docker-publish".

name: Docker publish (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: Image without a tag, e.g. ghcr.io/misoto22/kioku.
        required: true
        type: string
      context:
        description: Build context.
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: >-
          Comma-separated build platforms. Stay on a single native platform
          unless a second one is genuinely needed: cross-building through QEMU
          on a hosted runner is roughly ten times slower.
        required: false
        type: string
        default: linux/amd64
      push:
        description: Push the image, or build only.
        required: false
        type: boolean
        default: true

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
