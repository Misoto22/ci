# Reusable: lint the pull-request title against Conventional Commits.
#
# Why it matters: every repository in the fleet squash-merges, so the PR title
# becomes the commit subject on the default branch, and that subject is what
# release-please parses to decide the next version. A sloppy title is a missed
# release or a wrong bump.
#
# Callers must trigger on `pull_request_target`, because `pull_request` from a
# fork gets a read-only token:
#
#   on:
#     pull_request_target:
#       types: [opened, edited, synchronize, reopened, labeled, unlabeled]
#
# `labeled` / `unlabeled` are not strictly required, but without them the
# `ignoreLabels` skip below only takes effect on the next edit — and
# release-please applies its `autorelease: pending` label after opening the PR.
#
# Check name: GitHub renders a reusable-workflow job as
# "<caller job id> / <called job name>". This workflow's job is named
# `pr-title`, so a caller whose job id is also `pr-title` produces the status
# check context `pr-title / pr-title`. That exact string is what goes in a
# ruleset's required_status_checks — not a bare `pr-title`.

name: PR title (reusable)

on:
  workflow_call:
    inputs:
      types:
        description: >-
          Newline-delimited Conventional Commit types. Defaults to the fleet
          vocabulary, which is the same list as the branch-name <type> in
          HAR-NAME-006 and the commit types release-please parses.
        required: false
        type: string
        default: |
          feat
          fix
          chore
          docs
          refactor
          perf
          test
          ci
          build
          revert
          style
      scopes:
        description: >-
          Optional newline-delimited allowlist of scopes. Empty means any scope
          is accepted.
        required: false
        type: string
        default: ""
      require-scope:
        description: Require every PR title to carry a scope.
        required: false
        type: boolean
        default: false
      subject-pattern:
        description: >-
          Regex the subject must match. The default rejects a subject that
          starts with an uppercase letter.
        required: false
        type: string
        default: '^(?![A-Z]).+$'
      subject-pattern-error:
        description: Message shown when subject-pattern does not match.
        required: false
        type: string
        default: >-
          The subject "{subject}" in the PR title "{title}" must start with a
          lowercase letter and be written in the imperative mood, for example
          "add device auth" rather than "Added device auth".
      ignore-labels:
        description: >-
          Newline-delimited labels that skip validation. Defaults to
          release-please's own label so its "chore(main): release X.Y.Z" PRs are
          never blocked by a scope or subject rule they did not choose.
        required: false
        type: string
        default: |
          autorelease: pending

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate the PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: ${{ inputs.types }}
          scopes: ${{ inputs.scopes }}
          requireScope: ${{ inputs.require-scope }}
          subjectPattern: ${{ inputs.subject-pattern }}
          subjectPatternError: ${{ inputs.subject-pattern-error }}
          ignoreLabels: ${{ inputs.ignore-labels }}
